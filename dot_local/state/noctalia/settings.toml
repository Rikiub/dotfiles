config_version = 2

[bar.default]
capsule = true
center = [ "clock", "media" ]
end = [ "tray", "privacy", "clipboard", "notifications", "group:g1", "session" ]
reserve_space = false
shadow = false
smart_auto_hide = true

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "bluetooth", "network", "battery", "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0

[control_center]
hidden_tabs = [ "monitor", "weather" ]

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
reserve_space = false
shadow = false
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@VGA-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@VGA-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 683.0
    cy = 649.0
    output = "VGA-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@VGA-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = true

[shell]
polkit_agent = true
settings_show_advanced = false
telemetry_enabled = true

    [shell.panel]
    clipboard_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    shadow = false

    [shell.screenshot]
    directory = "/home/rikiub/Imagenes/Nube/📷 Capturas de pantalla"

[theme]
community_palette = "Oxocarbon"
mode = "light"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "kcolorscheme", "niri" ]

[wallpaper]
directory = "/home/rikiub/Imagenes/Nube/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/rikiub/Imagenes/Nube/Wallpapers/WhuKF9I.png"

    [wallpaper.last]
    path = "/home/rikiub/Imagenes/Nube/Wallpapers/WhuKF9I.png"

    [wallpaper.monitors.VGA-1]
    path = "/home/rikiub/Imagenes/Nube/Wallpapers/WhuKF9I.png"

    [[wallpaper.favorite]]
    path = "/home/rikiub/Imagenes/Nube/Wallpapers/up_in_the_heaven_by_marsallan_ddsimgp.png"
    theme_mode = "auto"

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
format = "{:%H:%M} | {:%a %d %b}"

[widget.date]
format = "{:%H:%M} | {:%a %d %b}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.spacer_2]
type = "spacer"

[widget.theme_mode]
enabled = true

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.workspaces]
labels_only_when_occupied = true